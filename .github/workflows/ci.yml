name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest

      - name: CLI smoke test
        run: |
          gmail-ingest --help
          test "$(gmail-ingest version)" = "0.3.0"
          gmail-ingest auth --help
          gmail-ingest profile --help
          gmail-ingest labels --help
          gmail-ingest snapshot --help
          gmail-ingest range --help
          python -m gmail_ingestion --help

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2" "twine>=6"

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Record SHA-256
        shell: bash
        run: |
          sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS-v0.3.0
          cat dist/SHA256SUMS-v0.3.0

      - name: Clean wheel install
        shell: bash
        run: |
          python -m venv /tmp/gmail-ingestion-wheel
          /tmp/gmail-ingestion-wheel/bin/python -m pip install --upgrade pip
          wheel="$(ls dist/gmail_ingestion-0.3.0-*.whl | head -n 1)"
          /tmp/gmail-ingestion-wheel/bin/python -m pip install "$wheel"
          test "$(/tmp/gmail-ingestion-wheel/bin/gmail-ingest version)" = "0.3.0"
          /tmp/gmail-ingestion-wheel/bin/python - <<'PY'
          from importlib.metadata import requires, version

          import gmail_ingestion
          from gmail_ingestion.schemas import NORMALIZED_SCHEMA_VERSION

          assert gmail_ingestion.__version__ == "0.3.0"
          assert NORMALIZED_SCHEMA_VERSION == "1"
          assert version("pyingestkit") == "2.1.0"
          requirements = requires("gmail-ingestion") or []
          assert any(
              "pyingestkit @ git+https://github.com/tawounfouet/pyingestkit.git@v2.1.0" in item
              for item in requirements
          )
          PY

      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gmail-ingestion-v0.3.0-dist
          path: dist/
          if-no-files-found: error
