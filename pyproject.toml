[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-ingestion"
dynamic = ["version"]
description = "Reliable, versioned Gmail ingestion connector built on PyIngestKit."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Awounfouet" }]
dependencies = [
  "pyingestkit @ git+https://github.com/tawounfouet/pyingestkit.git@main",
  "google-api-python-client>=2,<3",
  "google-auth>=2,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1.2,<2",
  "pydantic>=2.11,<3",
  "typer>=0.27,<0.28",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
gmail-ingest = "gmail_ingestion.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "gmail_ingestion._version.__version__"}

[tool.setuptools.package-data]
gmail_ingestion = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "PYI"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["gmail_ingestion"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
