name: Bootstrap v0.0.1 Tag

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create v0.0.1 tag
        run: |
          if git rev-parse "v0.0.1" >/dev/null 2>&1; then
            echo "v0.0.1 already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v0.0.1" "ea68bfa74795dca8eff349a115c7c2e8d6ba92c9" -m "Gmail Ingestion 0.0.1"
          git push origin "v0.0.1"
